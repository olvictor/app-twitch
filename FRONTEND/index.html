<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Twitch Clips Download</title>
  <style>
  @import url('https://fonts.googleapis.com/css2?family=Bebas+Neue&display=swap');
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');

  body {
    min-height: 100vh;
    margin: 0;
    background-color: #F3F3F7;
    font-family: "Bebas Neue", sans-serif;
    text-align: center;
    width: 100vw;
    overflow-x: hidden;
  }
  
  #clips {
    width: 100vw;
    max-width: 1400px;
    margin: 0 auto;
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    align-items: center;
    padding-bottom: 50px;
    gap: 20px; 
  }

  .clip-card {
    background: #FFFFFF;
    border-radius: 16px;
    padding: 15px;
    box-shadow: 0 8px 24px rgba(0,0,0,0.06);
    display: flex;
    flex-direction: column;
    align-items: center;
    position: relative;
    transition: transform 0.3s ease, box-shadow 0.3s ease;
    animation: fadeIn 0.5s ease backwards;
  }

  .clip-card:hover {
    transform: translateY(-5px);
    box-shadow: 0 12px 32px rgba(145, 70, 255, 0.15);
  }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(20px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .badge-baixado {
    position: absolute;
    top: -10px;
    right: -10px;
    background: #00E676;
    color: #000;
    padding: 6px 14px;
    border-radius: 20px;
    font-size: 12px;
    font-family: 'Inter', sans-serif;
    font-weight: 800;
    box-shadow: 0 4px 10px rgba(0, 230, 118, 0.4);
    z-index: 10;
    text-transform: uppercase;
  }

  iframe { 
    margin-bottom: 10px; /* Reduzido um pouco para dar espaço ao título */
    border-radius: 12px; 
    background-color: #000;
  }

  /* --- Estilo do Título do Clipe --- */
  .clip-title {
    font-family: 'Inter', sans-serif;
    font-size: 14px;
    font-weight: 700;
    color: #1f1f23; /* Cor padão de texto da Twitch */
    margin: 0 0 10px 0;
    width: 100%;
    text-align: left;
    /* Truque para limitar o título a 2 linhas se for muito grande */
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
    text-overflow: ellipsis;
    line-height: 1.3;
  }

  .container-input {
    display: flex;
    flex-direction: column;
    align-items: center;
    margin-bottom: 30px;
  }
  
  h1 {
    font-size: 3.5rem;
    font-weight: 700;
    letter-spacing: 1.2px;
    color: #9146FF;
    margin-bottom: 10px;
  }
  
  input {
    background-color: #FFFFFF;  
    border: 2px solid #E0E0E0;    
    border-radius: 8px;
    padding: 12px 16px;
    font-size: 16px;
    outline: none;
    transition: border 0.2s ease, box-shadow 0.2s ease;
    font-family: 'Inter', sans-serif;
    width: 250px;
  }

  input:focus {
    border-color: #9146FF;          
    box-shadow: 0 0 0 4px rgba(145, 70, 255, 0.15);
  }

  .btn-buscar {
    background: linear-gradient(90deg, #9146FF 0%, #772ce8 100%);  
    color: white;
    padding: 12px 28px;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    transition: transform 0.2s ease, box-shadow 0.2s ease, filter 0.2s ease;
    font-weight: 800;
    text-transform: uppercase;
    font-family: 'Inter', sans-serif;
    font-size: 15px;
    margin-top: 15px;
  }

  .btn-buscar:hover {
    transform: translateY(-2px);
    box-shadow: 0 6px 15px rgba(145, 70, 255, 0.4);
    filter: brightness(1.1);
  }

  .btn-buscar:active {
    transform: scale(0.98);
  }

  .btn-acao {
    text-decoration: none;
    padding: 10px; 
    border-radius: 8px;
    font-family: 'Inter', sans-serif;
    font-size: 13px; 
    font-weight: 700;
    transition: all 0.2s ease;
    text-align: center;
    width: 100%;
    box-sizing: border-box;
  }

  .btn-original {
    background: #F0F0F5;
    color: #333;
  }
  .btn-original:hover { background: #E4E4EB; }

  .btn-vertical {
    background: #9146FF;
    color: #FFF;
  }
  .btn-vertical:hover { background: #772ce8; }

  .loader-container {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    width: 100%;
    margin-top: 40px;
  }

  .spinner {
    width: 48px;
    height: 48px;
    border: 5px solid #E0E0E0;
    border-bottom-color: #9146FF;
    border-radius: 50%;
    display: inline-block;
    box-sizing: border-box;
    animation: rotation 1s linear infinite;
  }

  @keyframes rotation {
    0% { transform: rotate(0deg); }
    100% { transform: rotate(360deg); }
  }

  .loader-text {
    font-family: 'Inter', sans-serif;
    font-weight: 600;
    color: #666;
    margin-top: 15px;
    font-size: 1.1rem;
  }
  </style>
</head>
<body>
  <img src="assets/twitch.png" width="300px" style="margin-top: 40px;" alt="twitch logo" onerror="this.style.display='none'">
  
  <h1>Faça o download dos clipes</h1>
  
  <div class="container-input">
    <div>
      <input type="text" id="canal" placeholder="Twitch.tv/NomeDoCanal" onkeypress="if(event.key === 'Enter') buscar()">
    </div>
    <button class="btn-buscar" onclick="buscar()">Buscar Últimos 30 Dias</button>
  </div> 
  
  <div id="clips"></div>

  <script>
    function getDownloadsSalvos() {
      const salvos = localStorage.getItem('twitch_clipes_baixados');
      return salvos ? JSON.parse(salvos) : [];
    }

    function registrarDownload(clipId) {
      const salvos = getDownloadsSalvos();
      
      if (!salvos.includes(clipId)) {
        salvos.push(clipId);
        localStorage.setItem('twitch_clipes_baixados', JSON.stringify(salvos));
        
        const card = document.getElementById(`card-${clipId}`);
        if (card && !card.querySelector('.badge-baixado')) {
          const badge = document.createElement('div');
          badge.className = 'badge-baixado';
          badge.innerText = '✔️ Já Baixado';
          card.appendChild(badge);
        }
      }
    }

    async function buscar() {
      const canal = document.getElementById("canal").value.trim();
      if (!canal) return alert("Digite o nome do canal!");

      const clipsDiv = document.getElementById("clips");
      
      clipsDiv.innerHTML = `
        <div class="loader-container">
          <span class="spinner"></span>
          <p class="loader-text">Buscando os melhores clipes...</p>
        </div>
      `;

      try {
        const res = await fetch(`https://app-twitch.onrender.com/clips?channel=${canal}`);
        const json = await res.json();

        clipsDiv.innerHTML = "";

        if (!json.data || json.data.length === 0) {
          clipsDiv.innerHTML = "<p style='font-family: Inter, sans-serif; font-size: 1.2rem; color: #333;'>Nenhum clipe encontrado nos últimos 30 dias.</p>";
          return;
        }
        
        const host = window.location.hostname || "localhost";
        const downloadsSalvos = getDownloadsSalvos();
        
        json.data.forEach((clip, index) => {
          const downloadUrl = `https://app-twitch.onrender.com/download-clip?clipId=${clip.id}`; 
          const editNaTwitchUrl = clip.url; 
          const embedUrl = `${clip.embed_url}&parent=${host}`;

          const jaBaixado = downloadsSalvos.includes(clip.id);

          const div = document.createElement("div");
          div.className = "clip-card";
          div.id = `card-${clip.id}`;
          div.style.animationDelay = `${index * 0.05}s`;
          
          div.innerHTML = `
          ${jaBaixado ? '<div class="badge-baixado">✔️ Já Baixado</div>' : ''}
          
          <iframe
          src="${embedUrl}"
          height="180" 
          width="320"
          frameborder="0"
          scrolling="no"
          allowfullscreen="true">
          </iframe>
          
          <div style="display: flex; flex-direction: column; gap: 8px; width: 320px; margin-top: 5px;">
            <h3 class="clip-title" title="${clip.title}">${clip.title}</h3>
            
            <a href="${downloadUrl}" download class="btn-acao btn-original" onclick="registrarDownload('${clip.id}')">
              🖥️ Download Original (16:9)
            </a>
            <a href="${editNaTwitchUrl}" target="_blank" class="btn-acao btn-vertical" onclick="registrarDownload('${clip.id}')">
              📱 Criar Vertical (Nativo da Twitch)
            </a>
          </div>
        `;
          clipsDiv.appendChild(div);
        });
      } catch (err) {
        clipsDiv.innerHTML = "<p style='font-family: Inter, sans-serif; color: red;'>Erro ao buscar clipes. Verifique se o backend está rodando e respondendo corretamente.</p>";
      }
    }
  </script>
</body>
